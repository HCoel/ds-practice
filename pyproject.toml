[project]
name = "ds-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hannah", email = "hannahecoel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandera[polars]>=0.35.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
